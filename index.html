// ─── VIDEO PLAYER ─────────────────────────────────────────────────────────────
// vid.type === "github"  → direct <video> tag with GitHub asset URL
// vid.url + vid.start    → YouTube iframe with &start= timestamp
// vid.url only           → regular YouTube iframe

function getYouTubeId(url) {
  if (!url) return null;
  if (url.includes("shorts/")) return url.split("shorts/")[1].split("?")[0];
  const m = url.match(/[?&]v=([^&]+)/);
  return m ? m[1] : null;
}

function vidKey(vid) {
  if (!vid) return null;
  if (vid.type === "github") return "gh:" + vid.url;
  return "yt:" + (vid.url || "") + (vid.start || "");
}

function InlinePlayer({ vid, onClose }) {
  if (!vid) return null;

  // GitHub hosted video — plays via native <video> tag
  if (vid.type === "github") {
    return (
      <div style={{ marginTop: 12 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <div style={{ color:C.vid, fontSize:11, fontWeight:700, lineHeight:1.3, flex:1, paddingRight:8 }}>{vid.label}</div>
          <button onClick={onClose} style={{ background:"#2a2a2a", border:"none", color:C.muted, borderRadius:6, padding:"4px 10px", fontSize:12, cursor:"pointer" }}>✕</button>
        </div>
        <video
          src={vid.url}
          controls
          autoPlay
          playsInline
          style={{ width:"100%", borderRadius:10, background:"#000", display:"block" }}
        />
      </div>
    );
  }

  // YouTube (with optional start timestamp)
  const id = getYouTubeId(vid.url);
  if (!id) return null;
  const startParam = vid.start ? `&start=${vid.start}` : "";
  return (
    <div style={{ marginTop:12 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
        <div style={{ color:C.vid, fontSize:11, fontWeight:700, lineHeight:1.3, flex:1, paddingRight:8 }}>{vid.label}</div>
        <button onClick={onClose} style={{ background:"#2a2a2a", border:"none", color:C.muted, borderRadius:6, padding:"4px 10px", fontSize:12, cursor:"pointer" }}>✕</button>
      </div>
      <div style={{ position:"relative", width:"100%", paddingBottom:"56.25%", background:"#000", borderRadius:10, overflow:"hidden" }}>
        <iframe
          src={`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1${startParam}`}
          title={vid.label}
          allow="autoplay;fullscreen;encrypted-media;picture-in-picture"
          allowFullScreen
          style={{ position:"absolute", top:0, left:0, width:"100%", height:"100%", border:"none" }}
        />
      </div>
      {vid.start && (
        <div style={{ color:C.dim, fontSize:10, textAlign:"center", marginTop:6 }}>
          Plays from {Math.floor(vid.start/60)}:{String(vid.start%60).padStart(2,"0")} — {vid.source}
        </div>
      )}
    </div>
  );
}

function PlayButton({ vid, activeVid, setActiveVid }) {
  if (!vid) return null;
  const key = vidKey(vid);
  const isPlaying = vidKey(activeVid) === key;
  const subtitle = isPlaying ? "Tap to close"
    : vid.type === "github" ? "Plays inline ▶"
    : vid.start ? `${vid.source || "YouTube"} · from ${Math.floor(vid.start/60)}:${String(vid.start%60).padStart(2,"0")}`
    : `${vid.source || "YouTube"} · plays here`;
  return (
    <div>
      <button
        onClick={() => setActiveVid(isPlaying ? null : vid)}
        style={{ display:"flex", alignItems:"center", gap:10,
          background: isPlaying ? C.vid+"25" : C.vid+"12",
          border:`1px solid ${isPlaying ? C.vid+"70" : C.vid+"35"}`,
          borderRadius:9, padding:"10px 13px", marginTop:10,
          cursor:"pointer", width:"100%", textAlign:"left" }}
      >
        <div style={{ width:34, height:34, borderRadius:"50%", background:C.vid+"30",
          border:`1px solid ${C.vid}60`, display:"flex", alignItems:"center",
          justifyContent:"center", flexShrink:0 }}>
          <span style={{ color:C.vid, fontSize:isPlaying?12:15, marginLeft:isPlaying?0:3 }}>
            {isPlaying ? "■" : "▶"}
          </span>
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ color:C.vid, fontSize:12, fontWeight:600, lineHeight:1.3 }}>
            {isPlaying ? "Close player" : vid.label}
          </div>
          <div style={{ color:C.vid+"80", fontSize:10, marginTop:2 }}>{subtitle}</div>
        </div>
      </button>
      {isPlaying && <InlinePlayer vid={vid} onClose={() => setActiveVid(null)} />}
    </div>
  );
}

      <div onClick={()=>onNav("legs")} style={{background:C.legs+"08",border:`1px solid ${C.legs}30`,borderRadius:12,padding:"13px 15px",marginBottom:10,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{color:C.legs,fontSize:11,fontWeight:800,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>🦵 Legs — Sunday (optional)</div>
          <div style={{color:"#9ca3af",fontSize:12,lineHeight:1.5}}>Flatfoot protocol · Pistol progression · 15 exercises · 15 videos</div>
        </div>
        <span style={{color:C.legs,fontSize:18}}>›</span>
      </div>
      <RingHeightBanner activeVid={activeVid} setActiveVid={setActiveVid}/>
      {["push1","pull1","push2","pull2"].map(key=>{
        const s=sessions[key];
        return(
          <div key={key} onClick={()=>onNav(key)}
            style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${s.color}`,borderRadius:10,padding:"14px 16px",marginBottom:9,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
                <span style={{color:s.color,fontWeight:800,fontSize:14}}>{s.tag}</span>
                <span style={{color:C.muted,fontSize:12}}>{s.day}</span>
                <span style={{background:C.vid+"15",color:C.vid,fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:4}}>▶ {s.exercises.filter(e=>e.vid).length}</span>
                <span style={{background:C.wrist+"15",color:C.wrist,fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:4}}>💪 5min</span>

              <div style={{color:C.muted,fontSize:12,marginBottom:2}}>{s.focus}</div>
              <div style={{color:C.dim,fontSize:11}}>{s.exercises.length} exercises · 2 sets · {s.duration}</div>

      <div onClick={()=>onNav("swim")} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${C.swim}`,borderRadius:10,padding:"14px 16px",marginBottom:9,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App(){
  const[tab,setTab]=useState("plan");
  const[activeVid,setActiveVid]=useState(null);
  const tabs=[
    {id:"plan",label:"📅 Plan"},{id:"ringA",label:"Ring A"},{id:"ringB",label:"Ring B"},
    
    
    
    
    {id:"swim",label:"🏊 Swim"},
    {id:"legs",label:"🦵 Legs"},
    {id:"wrist",label:"💪 Wrist"},
    {id:"videos",label:"▶ Videos"},
    {id:"guide",label:"Guide"},
  ];
  const ringTabs=["push1","pull1","push2","pull2"];
  function accentFor(id){
    if(id==="videos") return C.vid;
    if(id==="wrist") return C.wrist;
    if(id==="legs") return C.legs;
    if(id==="swim"||id==="schedule") return C.swim;
    return C.push;
  }
  return(
    <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif",maxWidth:500,margin:"0 auto"}}>
      <div style={{padding:"20px 16px 14px",borderBottom:`1px solid ${C.border}`,background:"#0b0b0b"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:10,color:C.muted,letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>Rings · Swim · Legs · Wrist</div>
            <div style={{fontSize:22,fontWeight:800,color:C.text,letterSpacing:-0.5}}>Training Plan</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:C.push,fontSize:11,fontWeight:700}}>RINGS P1</div>
            <div style={{color:C.swim,fontSize:11,fontWeight:700}}>SWIM MONTHLY</div>
          </div>
        </div>
        <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:6}}>
          <Pill color={C.push}>ring A/B</Pill>
          <Pill color={C.swim}>swim monthly</Pill>
          <Pill color={C.legs}>legs</Pill>
          <Pill color={C.wrist}>wrist daily</Pill>
          <Pill color={C.vid}>50 videos</Pill>
        </div>
      </div>
      <div style={{display:"flex",overflowX:"auto",background:"#0b0b0b",borderBottom:`1px solid ${C.border}`,scrollbarWidth:"none"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            padding:"11px 10px",background:"none",border:"none",
            borderBottom:tab===t.id?`2px solid ${accentFor(t.id)}`:"2px solid transparent",
            color:tab===t.id?(["videos","wrist","legs"].includes(t.id)?accentFor(t.id):C.text):(["videos","wrist","legs"].includes(t.id)?accentFor(t.id)+"70":C.muted),
            fontSize:12,fontWeight:tab===t.id?700:400,cursor:"pointer",whiteSpace:"nowrap",transition:"color 0.15s"}}>
            {t.label}
          </button>
        ))}
      </div>
      <div>
        {tab==="plan"&&<PlanView onNav={setTab}/>}{(tab==="ringA"||tab==="ringB")&&<RingFullView which={tab} activeVid={activeVid} setActiveVid={setActiveVid}/>}
        {ringTabs.includes(tab)&&<SessionView sk={tab} activeVid={activeVid} setActiveVid={setActiveVid}/>}
        {tab==="swim"&&<SwimPhaseView/>}
        {tab==="legs"&&<LegsView activeVid={activeVid} setActiveVid={setActiveVid}/>}
        {tab==="wrist"&&<WristView activeVid={activeVid} setActiveVid={setActiveVid}/>}
        {tab==="videos"&&<AllVideosView activeVid={activeVid} setActiveVid={setActiveVid}/>}
        {tab==="guide"&&<GuideView activeVid={activeVid} setActiveVid={setActiveVid}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
